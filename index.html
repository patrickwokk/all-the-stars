<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick Kwok | all the stars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Favicon Core -->
	<link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
	<link rel="icon" type="image/x-icon" href="favicons/favicon.ico">

	<!-- Apple Touch Icon -->
	<link rel="apple-touch-icon" href="favicons/apple-touch-icon.png">

	<!-- Android/Chrome -->
	<link rel="icon" type="image/png" sizes="192x192" href="favicons/android-chrome-192x192.png">
	<link rel="icon" type="image/png" sizes="512x512" href="favicons/android-chrome-512x512.png">

	<!-- Web Manifest (optional if you have it) -->
	<link rel="manifest" href="favicons/site.webmanifest">
	<style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000000; /* Black background for space */
            color: #E0E0E0; 
            overflow: hidden; /* Critical for full screen canvas */
        }

        #three-canvas-container {
            position: fixed; /* Make canvas container fixed to cover viewport */
            top: 0;
            left: 0;
            width: 100vw;  /* Full viewport width */
            height: 100vh; /* Full viewport height */
            z-index: 1;    /* Behind text overlays */
            cursor: grab; 
        }

        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .content-overlay {
            position: fixed; /* Position text overlay fixed on top */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            text-align: center;
            z-index: 10;   /* Above canvas */
            padding: 2rem; /* Overall padding for the overlay */
            box-sizing: border-box; 
            pointer-events: none; 
        }

        .content-overlay .github-button, .content-overlay .copyright-text { /* Allow pointer events for specific children */
            pointer-events: auto; 
        }
        
        .intro-section {
            margin-top: auto; 
            margin-bottom: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%; /* Ensure it can take up space for max-width children */
        }

        .intro-text {
            font-size: 2.8rem; 
            font-weight: 700;
            margin-top: 0; 
            margin-bottom: 0.75rem;
            line-height: 1.2; 
            height: calc(2.8rem * 1.2); 
            display: flex; 
            align-items: baseline; 
            justify-content: center; 
        }
        .intro-text .name-highlight {
            color: #FFFACD; 
        }
        .tagline {
            font-size: 1.1rem;
            color: #B0B0B0;
            margin-bottom: 1rem; 
            opacity: 0; 
            visibility: hidden;
            height: 1.4rem; /* explicitly reserve space */ 
        }

        /* Vertical Scrolling Lyrics Section */
        .lyrics-scroll-wrapper { 
            width: fit-content;
            max-width: 500px; 
            max-height: 150px; 
            overflow: hidden;  
            margin-bottom: 2rem; 
            opacity: 0; 
            visibility: hidden; 
            position: relative; 
            height: 150px;  /* explicitly reserve height */
            pointer-events: auto; /* Enable hover effects on lyrics */
        }

        .lyrics-content { 
            /* animation applied by JS */
        }
        .lyrics-content.scrolling-active { 
            animation: vertical-scroll 30s linear infinite; 
        }
        
        @keyframes vertical-scroll {
            0% { transform: translateY(0%); }
            100% { transform: translateY(-50%); } 
        }

        .lyric-line {
            font-size: 1rem;
            color: #666; 
            padding: 0.2rem 0.5rem; 
            margin: 0.1rem 0;
            cursor: default; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 4px; 
            transition: color 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                        text-shadow 1.2s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 0.3s ease-out; 
        }
        .lyric-line.lyric-line-highlighted {
            color: #FFFACD; 
            text-shadow: 0 0 6px rgba(255, 250, 205, 0.7), 0 0 12px rgba(255, 250, 205, 0.5);
            transform: scale(1.01); 
            transition: color 0.15s ease-in, 
                        text-shadow 0.15s ease-in,
                        transform 0.15s ease-in;
        }

        .links-container { 
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            visibility: hidden; 
            min-height: 40px;  /* Ensure space is reserved */
            height: 40px; /* explicitly reserve height */
        }
        
        /* GitHub Button Styling */
        .github-button {
            display: inline-block;
            padding: 0.5rem; /* Padding around the SVG */
            border-radius: 50%; /* Make it circular */
            transition: background-color 0.3s ease-out, box-shadow 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .github-button svg {
            width: 28px; /* Adjust size as needed */
            height: 28px;
            display: block; /* Remove extra space below SVG */
        }
        .github-button svg path {
            fill: #666; /* Default dim color, same as lyrics */
            transition: fill 1.2s cubic-bezier(0.25, 1, 0.5, 1); /* Slow fade out for fill */
        }

        .github-button.button-highlighted svg path {
            fill: #FFFACD; /* Highlight color */
            transition: fill 0.15s ease-in; /* Quick fade in for fill */
        }
        .github-button.button-highlighted {
            box-shadow: 0 0 8px rgba(255, 250, 205, 0.3), 0 0 15px rgba(255, 250, 205, 0.2);
        }

        .typewriter-cursor {
            display: inline-block;
            background-color: #FFFACD; 
            width: 3px; 
            height: 1em; 
            margin-left: 2px; 
            animation: blink-caret .75s step-end infinite;
            vertical-align: baseline; 
        }

        .start-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            0%   { opacity: 0; transform: translateY(10px); visibility: visible; } 
            100% { opacity: 1; transform: translateY(0); visibility: visible; }
        }
        
        @keyframes blink-caret {
            from, to { background-color: transparent }
            50% { background-color: #FFFACD; }
        }

        .copyright-text {
            position: absolute;
            bottom: 1rem; /* Position from the bottom of .content-overlay */
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #777;
            opacity: 0; /* Initially hidden */
            visibility: hidden;
            /* animation: fadeIn 1s ease-out forwards; Will be triggered by JS */
        }

        .spotify-player {
            position: fixed;
            right: 1rem;
            bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
            width: min(360px, calc(100vw - 2rem));
            height: 80px;
            z-index: 30;
            pointer-events: auto;
        }
        .spotify-player iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }
        
        .message-box-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); display: flex; 
            justify-content: center; align-items: center; z-index: 1000; 
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .message-box-overlay.visible { opacity: 1; visibility: visible; }
        .message-box {
            background-color: #1e1e1e; padding: 2rem; border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center;
            max-width: 90%; width: 450px; border: 1px solid #333;
        }
        .message-box h3 { margin-top: 0; color: #FFFACD; font-size: 1.6rem; } 
        .message-box p { color: #C0C0C0; font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .message-box button {
            background-color: #FFFACD; color: #333; padding: 0.75rem 1.5rem; 
            border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;
            transition: background-color 0.3s ease; font-weight: 600;
        }
        .message-box button:hover { background-color: #F0E68C; } 

        /* Mobile Friendliness Adjustments */
        @media (min-width: 769px) and (max-width: 1366px) { /* iPad Air / iPad Pro landscape + portrait */
            .spotify-player {
                right: 0.75rem;
                bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
                width: min(280px, calc(100vw - 2rem));
                height: 72px;
            }
            .copyright-text {
                bottom: calc(5.4rem + env(safe-area-inset-bottom, 0px));
                padding: 0 1rem;
                box-sizing: border-box;
            }
        }
        @media (max-width: 768px) { /* Tablet and large phones */
            .intro-text { font-size: 2.2rem; height: calc(2.2rem * 1.2); }
            .tagline { font-size: 1rem; margin-bottom: 0.75rem;}
            .lyrics-scroll-wrapper { max-width: 90%; margin-bottom: 1.5rem; max-height: 120px;}
            .lyric-line { font-size: 0.9rem; }
            .links-container { min-height: 36px; } /* Adjust if needed */
            .github-button svg { width: 26px; height: 26px; }
            .content-overlay { padding: 1.5rem; padding-bottom: 3rem; /* Ensure space for copyright */ }
            .copyright-text { font-size: 0.7rem; bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); }
            .spotify-player {
                right: 0.75rem;
                bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
                width: calc(100vw - 1.5rem);
                max-width: 420px;
            }
        }
         @media (max-width: 480px) { /* Smaller phones */
            .intro-text { font-size: 1.8rem; height: calc(1.8rem * 1.2); margin-bottom: 0.5rem;}
            .tagline { font-size: 0.85rem; margin-bottom: 0.75rem;}
            .lyrics-scroll-wrapper { max-height: 100px; margin-bottom: 1rem; }
            .lyric-line { font-size: 0.75rem; padding: 0.15rem 0.4rem;}
            .github-button svg { width: 24px; height: 24px; }
            .github-button { padding: 0.4rem; }
            .content-overlay { padding: 1rem; padding-bottom: 2.5rem; /* Ensure space for copyright */ }
            .typewriter-cursor { height: 0.9em; }
            .copyright-text { font-size: 0.65rem; bottom: calc(5.8rem + env(safe-area-inset-bottom, 0px)); }
        }
        @media (max-height: 600px) and (max-width: 480px) { /* Very short screens */
             .intro-text { font-size: 1.6rem; height: calc(1.6rem * 1.2); margin-bottom: 0.4rem;}
             .tagline { font-size: 0.8rem; margin-bottom: 0.5rem;}
             .lyrics-scroll-wrapper { max-height: 80px; margin-bottom: 0.75rem; }
             .lyric-line { font-size: 0.7rem; }
             .content-overlay { padding-bottom: 2rem; }
        }
    </style>
</head>
<body>
    <div id="three-canvas-container">
        <canvas id="three-canvas"></canvas>
    </div>

    <div class="content-overlay">
        <div class="intro-section"> 
            <div id="typewriter-text" class="intro-text">
                </div>
            <div class="tagline"> 
                Because Kendrick Knows Better...
            </div>
            <div class="lyrics-scroll-wrapper" id="lyricsWrapper">
                <div class="lyrics-content" id="lyricsContent">
                    </div>
            </div>
            <div class="links-container" id="linksContainer">
                 <a href="https://github.com/patrickwokk" target="_blank" rel="noopener noreferrer" class="github-button" id="githubBtn" aria-label="GitHub profile">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.56 0-.28-.01-1.2-.02-2.17-3.2.69-3.88-1.35-3.88-1.35-.52-1.32-1.28-1.67-1.28-1.67-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.72-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .98-.31 3.2 1.18a11.2 11.2 0 0 1 5.83 0c2.22-1.49 3.2-1.18 3.2-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.82 1.19 3.08 0 4.42-2.68 5.39-5.24 5.67.41.35.77 1.03.77 2.08 0 1.5-.01 2.7-.01 3.07 0 .31.21.67.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
                    </svg>
                 </a>
            </div>
        </div>
        <div class="copyright-text" id="copyrightText">
            &copy; 2026 Patrick Kwok. Orbiting Ideas, Grounded in Code.
        </div>
    </div>

    <div class="spotify-player" aria-label="Spotify player for All the Stars by Kendrick Lamar and SZA">
        <iframe
            src="https://open.spotify.com/embed/track/3GCdLUSnKSMJhs4Tj6CV3s?utm_source=generator&t=35"
            loading="lazy"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            title="All the Stars by Kendrick Lamar and SZA">
        </iframe>
    </div>

    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box">
            <h3 id="messageBoxTitle">Connect</h3> <p id="messageBoxText">This is where your LinkedIn profile or contact form would go! For now, it's a concept.</p>
            <button id="messageBoxClose">Close</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls; 
        
        const canvasContainer = document.getElementById('three-canvas-container'); 
        const canvas = document.getElementById('three-canvas');

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000); 
            camera.position.set(0, 0, 1); 
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0); 
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.1); 
            scene.add(ambientLight);
            
            const createStarLayer = (count, baseSize, baseOpacity, color, spreadFactor) => {
                const vertices = [];
                for (let i = 0; i < count; i++) {
                    const x = THREE.MathUtils.randFloatSpread(2500 * spreadFactor);
                    const y = THREE.MathUtils.randFloatSpread(2500 * spreadFactor);
                    const z = THREE.MathUtils.randFloatSpread(2500 * spreadFactor);
                    if (Math.sqrt(x*x + y*y + z*z) > 70 * spreadFactor) vertices.push(x, y, z);
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                const material = new THREE.PointsMaterial({
                    color: color, size: baseSize * (window.devicePixelRatio > 1 ? 0.7 : 1), 
                    transparent: true, opacity: baseOpacity, sizeAttenuation: true, depthWrite: false 
                });
                return new THREE.Points(geometry, material);
            };
            scene.add(createStarLayer(20000, 0.6, 0.7, 0xaaaacc, 1.2)); 
            scene.add(createStarLayer(5000, 0.9, 0.85, 0xffffff, 1.0));
            scene.add(createStarLayer(1000, 1.2, 0.95, 0xffffdd, 0.8)); 

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.04; 
            controls.enablePan = true; controls.enableZoom = true; 
            controls.minDistance = 0.01; controls.maxDistance = 1500;  
            controls.autoRotate = true; controls.autoRotateSpeed = 0.08; 
            controls.target.set(0, 0, 0); 

            window.addEventListener('resize', onWindowResize, false);
            canvasContainer.addEventListener('mousedown', () => canvasContainer.style.cursor = 'grabbing', false);
            canvasContainer.addEventListener('mouseup', () => canvasContainer.style.cursor = 'grab', false);
            canvasContainer.addEventListener('touchstart', () => canvasContainer.style.cursor = 'grabbing', { passive: true });
            canvasContainer.addEventListener('touchend', () => canvasContainer.style.cursor = 'grab', false);
            animate();
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update(); 
            renderer.render(scene, camera);
        }

        // Typewriter effect
        const typewriterElement = document.getElementById('typewriter-text');
        const parts = [
            { text: "hi,", isTag: false }, 
            { text: "&nbsp;", isTag: false }, 
            { text: "<span class='name-highlight'>", isTag: true },
            { text: "Patrick", isTag: false }, 
            { text: "</span>", isTag: true },
            { text: "&nbsp;here.", isTag: false } 
        ];
        const typingSpeed = 75; 
        let partIndex = 0;
        let charInPartIndex = 0;
        let currentVisibleHTML = "";
        const cursorHTML = "<span class='typewriter-cursor'></span>";

        function typeNextCharacter() {
            if (typewriterElement && partIndex < parts.length) { 
                const currentPart = parts[partIndex];
                if (currentPart.isTag) {
                    currentVisibleHTML += currentPart.text;
                    partIndex++;
                    charInPartIndex = 0;
                     if (partIndex < parts.length) { 
                        typeNextCharacter(); 
                    } else { 
                        finalizeTyping();
                    }
                } else { 
                    if (charInPartIndex < currentPart.text.length) {
                        if (currentPart.text.substring(charInPartIndex).startsWith("&nbsp;")) {
                            currentVisibleHTML += "&nbsp;";
                            charInPartIndex += "&nbsp;".length;
                        } else {
                            currentVisibleHTML += currentPart.text[charInPartIndex];
                            charInPartIndex++;
                        }
                        typewriterElement.innerHTML = currentVisibleHTML + cursorHTML;
                        setTimeout(typeNextCharacter, typingSpeed);
                    } else { 
                        partIndex++;
                        charInPartIndex = 0;
                        if (partIndex < parts.length) { 
                            typeNextCharacter(); 
                        } else { 
                           finalizeTyping();
                        }
                    }
                }
            } else if (typewriterElement) { 
                finalizeTyping();
            }
        }

        function finalizeTyping() {
            if (typewriterElement) { 
                typewriterElement.innerHTML = currentVisibleHTML; 
                const cursorSpan = document.createElement('span');
                cursorSpan.classList.add('typewriter-cursor');
                typewriterElement.appendChild(cursorSpan);
            }
            triggerFadeInAnimations();
        }

        // Lyrics data and functionality
        const lyricsContentElement = document.getElementById('lyricsContent');
        const newLyrics = [
            "This may be the night that my dreams might let me know",
            "All the stars approach you",
            "All the stars approach you",
            "All the stars approach you",
            "This may be the night that my dreams might let me know",
            "All the stars are closer",
            "All the stars are closer",
            "All the stars are closer"
        ];

        function populateAndScrollLyrics() {
            if (!lyricsContentElement) return;
            lyricsContentElement.innerHTML = ''; 
            
            const lyricsToDisplay = [...newLyrics, ...newLyrics]; 

            lyricsToDisplay.forEach((lineText) => {
                const lineDiv = document.createElement('div');
                lineDiv.classList.add('lyric-line');
                lineDiv.textContent = lineText;

                lineDiv.addEventListener('mouseenter', () => {
                    if (lineDiv.dataset.fadeTimeout) {
                        clearTimeout(parseInt(lineDiv.dataset.fadeTimeout));
                        lineDiv.removeAttribute('data-fade-timeout');
                    }
                    lineDiv.classList.add('lyric-line-highlighted');
                });

                lineDiv.addEventListener('mouseleave', () => {
                    const timeoutId = setTimeout(() => {
                        lineDiv.classList.remove('lyric-line-highlighted');
                        lineDiv.removeAttribute('data-fade-timeout');
                    }, 200); 
                    lineDiv.dataset.fadeTimeout = timeoutId.toString();
                });

                lyricsContentElement.appendChild(lineDiv);
            });
        }


        function triggerFadeInAnimations() {
            const taglineElement = document.querySelector('.tagline');
            const lyricsWrapperElement = document.querySelector('.lyrics-scroll-wrapper'); 
            const linksContainerElement = document.querySelector('.links-container'); 
            const copyrightTextElement = document.getElementById('copyrightText');
            
            if (!taglineElement && !linksContainerElement && !lyricsWrapperElement && !copyrightTextElement) {
                 console.error("Error: Required elements not found in triggerFadeInAnimations.");
                 return;
            }
            
            let totalCharsToType = 0;
            parts.forEach(p => { 
                if (!p.isTag) {
                    totalCharsToType += p.text.replace(/&nbsp;/g, ' ').length; 
                }
            });
            const totalTypingDuration = totalCharsToType * typingSpeed;

            const taglineDelay = totalTypingDuration + 100; 
            const lyricsDelay = totalTypingDuration + 300; 
            const linksDelay = totalTypingDuration + 600;  
            const copyrightDelay = totalTypingDuration + 800; // Copyright appears last

            if (taglineElement) {
                setTimeout(() => { taglineElement.classList.add('start-fade-in'); }, taglineDelay);
            }
            
            if (lyricsWrapperElement) { 
                populateAndScrollLyrics(); 
                setTimeout(() => { 
                    lyricsWrapperElement.classList.add('start-fade-in'); 
                    setTimeout(() => {
                        if (lyricsContentElement) {
                            lyricsContentElement.classList.add('scrolling-active');
                        }
                    }, 150); 
                }, lyricsDelay);
            }

            if (linksContainerElement) { 
                 setTimeout(() => { linksContainerElement.classList.add('start-fade-in'); }, linksDelay);
            }
            if (copyrightTextElement) {
                setTimeout(() => { copyrightTextElement.classList.add('start-fade-in'); }, copyrightDelay);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initThree();
                if (typewriterElement) { 
                    typeNextCharacter(); 
                } else {
                    console.error("Error: Typewriter element not found for initialization.");
                }
                // Add event listener for new GitHub button
                const githubButton = document.getElementById('githubBtn');
                if (githubButton) {
                    githubButton.addEventListener('mouseenter', () => {
                        if (githubButton.dataset.fadeTimeout) {
                            clearTimeout(parseInt(githubButton.dataset.fadeTimeout));
                            githubButton.removeAttribute('data-fade-timeout');
                        }
                        githubButton.classList.add('button-highlighted');
                    });
                    githubButton.addEventListener('mouseleave', () => {
                         const timeoutId = setTimeout(() => {
                            githubButton.classList.remove('button-highlighted');
                            githubButton.removeAttribute('data-fade-timeout');
                        }, 200); 
                        githubButton.dataset.fadeTimeout = timeoutId.toString();
                    });
                }

            });
        } else {
            initThree();
            if (typewriterElement) { 
                typeNextCharacter(); 
            } else {
                console.error("Error: Typewriter element not found for initialization.");
            }
            // Add event listener for new GitHub button (if DOM already loaded)
            const githubButton = document.getElementById('githubBtn');
            if (githubButton) {
                githubButton.addEventListener('mouseenter', () => {
                     if (githubButton.dataset.fadeTimeout) {
                        clearTimeout(parseInt(githubButton.dataset.fadeTimeout));
                        githubButton.removeAttribute('data-fade-timeout');
                    }
                    githubButton.classList.add('button-highlighted');
                });
                githubButton.addEventListener('mouseleave', () => {
                    const timeoutId = setTimeout(() => {
                        githubButton.classList.remove('button-highlighted');
                        githubButton.removeAttribute('data-fade-timeout');
                    }, 200); 
                    githubButton.dataset.fadeTimeout = timeoutId.toString();
                });
            }
        }
        
        // --- Message Box Functionality (kept in case of future use) ---
        const messageBoxOverlay = document.getElementById('messageBoxOverlay');
        const messageBoxTitle = document.getElementById('messageBoxTitle');
        const messageBoxText = document.getElementById('messageBoxText');
        const messageBoxClose = document.getElementById('messageBoxClose');

        function showMessageBox(title, text) {
            if (messageBoxOverlay && messageBoxTitle && messageBoxText && messageBoxClose) { 
                messageBoxTitle.textContent = title;
                messageBoxText.innerHTML = text;
                messageBoxOverlay.classList.add('visible');
            } else {
                console.error("Message box elements not found.");
            }
        }
        function hideMessageBox() {
            if (messageBoxOverlay) { 
                messageBoxOverlay.classList.remove('visible');
            }
        }
        if (messageBoxClose) { 
            messageBoxClose.addEventListener('click', hideMessageBox);
        }
        if (messageBoxOverlay) { 
            messageBoxOverlay.addEventListener('click', (event) => {
                if (event.target === messageBoxOverlay) hideMessageBox();
            });
        }
    </script>
</body>
</html>
